config_version = 14

[backdrop]
enabled = true

[bar.default]
background_opacity = 0.74999998323619366
center = [ "clock", "lyrics", "cat" ]
end = [
    "tray",
    "group:g1",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "widget",
    "notifications",
    "session"
