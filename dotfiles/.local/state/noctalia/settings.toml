[nightlight]
enabled = true
temperature_day = 6600
temperature_night = 4500

[osd]
position = "bottom_center"

[plugin_settings."alexander/screen-toolkit"]
panel-mode = "legacy"
selected-ocr-lang = "eng+chi_sim"
video-path = "~/Videos/Recordings"

[plugin_settings."h465855hgg/lyrics"]
font_weight = "bold"
lyrics_sources = [ "qqmusic", "kugou", "apple_music", "spotify", "qishui", "splayer", "lrclib", "netease", "musixmatch" ]
player_allowlist = [ "voicefox", "moekoemusic", "musicfree-desktop" ]

[plugin_settings."noctalia/translator"]
target_lang = "zh"

[plugin_settings."yuuto/arch-updater"]
auto_check_hours = 1
update_cmd = "sysup"

[plugins]
auto_update = "all"
enabled = [ "alexander/screen-toolkit", "noctalia/bongocat", "yuuto/arch-updater", "h465855hgg/lyrics" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
font_family = "WenQuanYi Zen Hei"
password_style = "random"
polkit_agent = true
settings_window_translucent = true
telemetry_enabled = true

    [shell.launcher.providers.session]
    prefix = ""

    [shell.panel]
    transparency_mode = "glass"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-fruit-salad"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt", "starship" ]
    community_ids = [
        "pi-agent",
        "telegram",
        "libreoffice",
        "neovim",
        "vscode",
        "steam",
        "fuzzel",
        "fastfetch",
        "fcitx5",
        "fzf",
        "yazi"
    ]

[wallpaper]
directory = "/home/flyingyu/Pictures/Wallpapers"
directory_dark = "/home/flyingyu/Pictures/Wallpapers/dark"
directory_light = "/home/flyingyu/Pictures/Wallpapers/light"

    [wallpaper.automation]
    enabled = true
    recursive = false

    [wallpaper.default]
    path = "/home/flyingyu/Pictures/Wallpapers/dark/wallhaven-nrywlq_1920x1080.png"

    [wallpaper.last]
    path = "/home/flyingyu/Pictures/Wallpapers/dark/wallhaven-nrywlq_1920x1080.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/flyingyu/Pictures/Wallpapers/dark/wallhaven-nrywlq_1920x1080.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/flyingyu/Pictures/Wallpapers/dark/wallhaven-nrywlq_1920x1080.png"

