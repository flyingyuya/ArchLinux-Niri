# : Manager [[[

[manager]
cwd = { fg = "#f0dedf" }

# Tab
tab_active = { fg = "#561d25", bg = "#ffb2b8", bold = true }
tab_inactive = { fg = "#ffdadb", bg = "#3b0711" }
tab_width = 1

# Find
find_keyword = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied = { fg = "#ffaf4e", bg = "#ffaf4e" }
marker_cut = { fg = "#ffddb4", bg = "#ffddb4" }
marker_marked = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#e8c08e", bg = "#e8c08e" }

# Count
count_copied = { fg = "#291800", bg = "#ffddb4" }
count_cut = { fg = "#291800", bg = "#ffddb4" }
count_selected = { fg = "#561d25", bg = "#e8c08e" }

# Border
border_symbol = "│"
border_style  = { fg = "#ffb2b8" }

# : ]]]


# : Status [[[

[status]
separator_open = "🭁"
separator_close = "🭠"
separator_style = { bg = "#561d25", fg = "#F4A261" }

[mode]
# Mode
normal_main = { bg = "#ffb2b8", fg = "#561d25", bold = true }
normal_alt  = { bg = "#524344", fg = "#d7c1c2" }

# Select mode
select_main = { bg = "#e6bdbf", fg = "#44292b", bold = true }
select_alt  = { bg = "#524344", fg = "#d7c1c2" }

# Unset mode
unset_main = { bg = "#e8c08e", fg = "#432c06", bold = true }
unset_alt  = { bg = "#524344", fg = "#d7c1c2" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#ffb2b8", bg = "#413737" }
progress_error = { fg = "#ffb4ab", bg = "#413737" }

# Permissions
permissions_t = { fg = "#bc4e53" }
permissions_w = { fg = "#b87725" }
permissions_x = { fg = "#ff2b12" }
permissions_r = { fg = "#ff981b" }
permissions_s = { fg = "#ff4146" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#ffb2b8" }
active = { fg = "#e8c08e", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#ffb2b8" }
value = { fg = "#f0dedf" }

# : ]]]


# : Completion [[[

[completion]
border = { fg = "#ffb2b8", bg = "#561d25" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#ffb2b8" }
title = {}
hovered = { fg = "#ffddb4", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#413737" }
cand = { fg = "#ffb2b8" }
rest = { fg = "#561d25" }
desc = { fg = "#f0dedf" }
separator = " ▶ "
separator_style = { fg = "#f0dedf" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#f0dedf" }
run = { fg = "#f0dedf" }
footer = { fg = "#44292b", bg = "#e6bdbf" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#e8c08e" }
title_warn = { fg = "#ffb2b8" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { name = "*", fg = "#f0dedf" },
    { name = "*/", fg = "#ffb2b8" },
]

# : ]]]