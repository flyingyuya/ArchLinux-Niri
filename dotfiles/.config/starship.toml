"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

format = """
[╭ ](bold fg:text)\
$os\
$username\
$directory\
$time\
$git_branch\
$git_status\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$conda\
$pixi\
$line_break$character"""

[character]
disabled = false
success_symbol = '[╰─>](bold fg:text) '
error_symbol = '[╰─>](bold fg:red) '
vimcmd_symbol = '[╰─](bold fg:green) '

# ==================== 核心模块（胶囊舱风格） ====================

[os]
disabled = false
style = "fg:crust bg:maroon" # 使用深色字衬托亮色背景
format = "[](fg:maroon)[$symbol ]($style)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "fg:crust bg:maroon"
style_root = "fg:crust bg:maroon"
format = "[$user]($style)[](fg:maroon) "

[directory]
style = "fg:text bg:mauve"
format = "[](fg:mauve)[$path]($style)[](fg:mauve) "
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""
"Developer" = "󰲋"

[time]
disabled = false
time_format = "%R"
style = "fg:crust bg:teal"
format = "[](fg:teal)[ $time]($style)[](fg:teal) "

[git_branch]
symbol = ""
style = "fg:text bg:lavender"
format = "[](fg:lavender)[$symbol $branch]($style)"

[git_status]
style = "fg:text bg:lavender"
format = "([$all_status$ahead_behind]($style))[](fg:lavender) "

# ==================== 语言与环境开发链（Glow 胶囊） ====================

[python]
symbol = ""
style = "fg:crust bg:flamingo"
format = "[](fg:flamingo)[$symbol $version]($style)[](fg:flamingo) "

[nodejs]
symbol = ""
style = "fg:crust bg:green"
format = "[](fg:green)[$symbol $version]($style)[](fg:green) "

[c]
symbol = " "
style = "fg:crust bg:sapphire"
format = "[](fg:sapphire)[$symbol $version]($style)[](fg:sapphire) "

[cpp]
symbol = " "
style = "fg:crust bg:sapphire"
format = "[](fg:sapphire)[$symbol $version]($style)[](fg:sapphire) "

[rust]
symbol = ""
style = "fg:crust bg:peach"
format = "[](fg:peach)[$symbol $version]($style)[](fg:peach) "

[golang]
symbol = ""
style = "fg:crust bg:sky"
format = "[](fg:sky)[$symbol $version]($style)[](fg:sky) "

[docker_context]
symbol = ""
style = "fg:text bg:surface2"
format = "[](fg:surface2)[$symbol $context]($style)[](fg:surface2) "

[conda]
style = "fg:text bg:surface2"
format = "[](fg:surface2)[$symbol $environment]($style)[](fg:surface2) "

[line_break]
disabled = false












































































































































































































































































































































































































































































































































































































































































































































































































































































































































































































































































